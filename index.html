<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>현장 직원 배치 관리</title>
<style>
:root{
  --bg:#f4f6f9; --surface:#ffffff; --border:#e3e7ee; --border2:#d3dae4;
  --text:#1f2937; --muted:#6b7280; --faint:#9aa3af;
  --primary:#2f5d8a; --primary-soft:#e8eff7; --primary-border:#bcd3ea;
  --blue:#2f6fdf; --blue-bg:#eaf1fd;
  --green:#1d9d74; --green-bg:#e6f7f0;
  --amber:#c77d1c; --amber-bg:#fdf3e3;
  --red:#d64545; --red-bg:#fdecec;
  --gray:#5b6472; --gray-bg:#eef1f5;
  --radius:8px; --shadow:0 1px 3px rgba(16,24,40,.08);
  --mono:ui-monospace,Consolas,"Courier New",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",-apple-system,"Segoe UI",sans-serif;font-size:14px;line-height:1.5}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--text)}
a{color:var(--primary)}
.hidden{display:none!important}

header{background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50}
.head-inner{max-width:1240px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;letter-spacing:-.3px}
.brand .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#2f5d8a,#4a7bb0);color:#fff;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:800}
.brand .sub{font-size:12px;color:var(--muted);font-weight:400;margin-top:1px}
.tabs{display:flex;gap:4px;margin-left:8px;flex-wrap:wrap}
.tab{padding:8px 16px;border:1px solid transparent;border-radius:8px;background:transparent;color:var(--muted);font-size:14px;font-weight:600}
.tab:hover{background:var(--gray-bg);color:var(--text)}
.tab.active{background:var(--primary-soft);color:var(--primary);border-color:var(--primary-border)}
.head-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.icon-btn{width:34px;height:34px;border:1px solid var(--border);border-radius:8px;background:var(--surface);font-size:16px;color:var(--muted)}
.icon-btn:hover{background:var(--gray-bg)}

main{max-width:1240px;margin:0 auto;padding:20px}
.view{display:none}
.view.active{display:block}
.section-title{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:6px 0 14px}
.section-title h2{margin:0;font-size:19px;letter-spacing:-.3px}
.section-title p{margin:0;color:var(--muted);font-size:13px}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
.card .num{font-size:24px;font-weight:800;letter-spacing:-.5px}
.card .lbl{font-size:12px;color:var(--muted);margin-top:2px}
.card.click{cursor:pointer;transition:transform .05s ease}
.card.click:hover{outline:2px solid var(--primary-border)}
.card.alert .num{color:var(--red)}
.card.ok .num{color:var(--green)}
.card.blue .num{color:var(--blue)}
.card.amber .num{color:var(--amber)}

.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden}
.panel-head{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#fbfcfe}
.panel-head h3{margin:0;font-size:15px}
.panel-head .spacer{margin-left:auto}
.panel-body{padding:16px}
.panel-body.tight{padding:0}

.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.filters label{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.filters select,.filters input{padding:6px 10px;border:1px solid var(--border2);border-radius:6px;background:var(--surface)}
.filters input[type=search]{min-width:180px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:20px;font-size:12px;font-weight:600;line-height:1.7;white-space:nowrap}
.chip.blue{background:var(--blue-bg);color:var(--blue)}
.chip.green{background:var(--green-bg);color:var(--green)}
.chip.amber{background:var(--amber-bg);color:var(--amber)}
.chip.red{background:var(--red-bg);color:var(--red)}
.chip.gray{background:var(--gray-bg);color:var(--gray)}
.chip.toggle{cursor:pointer;border:1px solid transparent}
.chip.toggle.on{outline:2px solid var(--red);outline-offset:1px}

table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 10px;border-bottom:1px solid var(--border);text-align:left;vertical-align:middle}
th{background:var(--gray-bg);color:var(--gray);font-weight:600;white-space:nowrap}
tbody tr:hover{background:#fafbfd}
tr.row-click{cursor:pointer}
.empty{padding:36px 16px;text-align:center;color:var(--faint);font-size:14px}
.warn-row{background:#fff7f7}
.warn-row:hover{background:#fff1f1}
.warn-row td:first-child{box-shadow:inset 3px 0 0 var(--red)}
.muted{color:var(--muted)}
.faint{color:var(--faint)}
.small{font-size:12px}
.mono{font-family:var(--mono);font-size:12px}

.site-gap{border-bottom:10px solid var(--bg)}

.tl{display:flex;gap:10px;align-items:center;padding:7px 16px;border-bottom:1px solid var(--border)}
.tl:hover{background:#fafbfd}
.tl-label{flex:0 0 240px;display:flex;flex-direction:column;gap:1px}
.tl-name{font-weight:600;font-size:13px;display:flex;align-items:center;gap:6px}
.tl-meta{font-size:11px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tl-chart{flex:1 1 auto;position:relative}
.tl-row{position:relative;height:34px;margin:2px 0}
.tl-row::before{content:"";position:absolute;left:0;right:0;top:0;bottom:0;background:repeating-linear-gradient(to right,#fff,#fff calc(100%/8 - 1px),#f2f4f8 calc(100%/8 - 1px),#f2f4f8 calc(100%/8));border:1px solid var(--border);border-radius:6px}
.bar{position:absolute;top:4px;bottom:4px;border-radius:6px;color:#fff;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;overflow:hidden;white-space:nowrap;min-width:0;z-index:2;box-shadow:0 1px 2px rgba(0,0,0,.18)}
.bar.contract{background:var(--blue)}
.bar.actual{background:var(--green)}
.bar.pending{background:var(--amber)}
.bar.overlap{background:repeating-linear-gradient(45deg,var(--red),var(--red) 6px,#b83b3b 6px,#b83b3b 12px)}
.ov-overlay{position:absolute;top:4px;bottom:4px;border-radius:6px;background:repeating-linear-gradient(45deg,rgba(214,69,69,.9),rgba(214,69,69,.9) 5px,rgba(184,59,59,.9) 5px,rgba(184,59,59,.9) 10px);z-index:3;pointer-events:none}
.ticks{position:relative;height:18px;margin:4px 16px 0 266px;border-bottom:1px solid var(--border2);font-size:10px;color:var(--faint)}
.ticks span{position:absolute;transform:translateX(-50%);white-space:nowrap}

.btn{border:1px solid var(--border2);border-radius:7px;padding:7px 14px;background:var(--surface);font-size:13px;font-weight:600;color:var(--text)}
.btn:hover{background:var(--gray-bg)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{background:#274f79}
.btn.danger{background:#fff;border-color:#e5b8b8;color:var(--red)}
.btn.danger:hover{background:var(--red-bg)}
.btn.sm{padding:4px 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.badge{display:inline-block;padding:1px 7px;border-radius:4px;font-size:11px;font-weight:600}
.badge.confirm{background:var(--gray-bg);color:var(--gray)}
.badge.demo{background:#f1e9f7;color:#7a4f9e}
.badge.red{background:var(--red-bg);color:var(--red)}

.modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
.modal{background:var(--surface);border-radius:10px;box-shadow:0 10px 40px rgba(0,0,0,.18);width:100%;max-width:720px}
.modal-head{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.modal-head h3{margin:0;font-size:16px;flex:1}
.modal-body{padding:18px;max-height:70vh;overflow:auto}
.modal-foot{padding:12px 18px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;background:#fbfcfe;border-radius:0 0 10px 10px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;color:var(--gray);font-weight:600;margin-bottom:5px}
.field .req{color:var(--red)}
.field input,.field select,.field textarea{width:100%;padding:8px 10px;border:1px solid var(--border2);border-radius:6px}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--primary-border);border-color:var(--primary)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 14px}
.hint{font-size:12px;color:var(--faint);margin-top:4px}

.toast-wrap{position:fixed;right:20px;top:70px;z-index:200;display:flex;flex-direction:column;gap:8px}
.toast{background:#1f2937;color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,.2);max-width:360px;animation:slidein .18s ease}
.toast.err{background:#a93232}
.toast.ok{background:#17805f}
@keyframes slidein{from{transform:translateX(20px);opacity:0}to{transform:none;opacity:1}}

.legend{display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;margin-right:4px;vertical-align:-2px}

.ai-cards{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.ai-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);overflow:hidden}
.ai-card.full{grid-column:1/-1}
.ai-card-head{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.ai-card-head h3{margin:0;font-size:15px;flex:1}
.ai-card-body{padding:14px 16px}
.ai-item{border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:10px;background:#fbfcfe}
.ai-item:last-child{margin-bottom:0}
.ai-item h4{margin:0 0 6px;font-size:13px}
.ai-item .grid3{font-size:12px;color:var(--text);margin-bottom:6px}
.ai-item .grid3 b{color:var(--gray);font-weight:600}
.ai-summary{background:var(--primary-soft);border-left:3px solid var(--primary);padding:8px 10px;border-radius:6px;font-size:13px;margin-top:6px}
.ai-summary .src{font-size:11px;color:var(--primary);font-weight:600}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--primary-border);border-top-color:var(--primary);border-radius:50%;animation:rot .7s linear infinite;vertical-align:-2px}
@keyframes rot{to{transform:rotate(360deg)}}
.pill{display:inline-block;margin-left:6px;padding:0 7px;border-radius:10px;font-size:11px;font-weight:600}
.pill.ai{background:var(--primary-soft);color:var(--primary)}
.pill.rule{background:var(--gray-bg);color:var(--gray)}

.sub-tabs{display:flex;gap:6px;margin-bottom:14px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.sub-tab{padding:8px 14px;border:1px solid transparent;border-bottom:none;border-radius:8px 8px 0 0;background:transparent;color:var(--muted);font-weight:600;font-size:13px}
.sub-tab.active{background:var(--surface);color:var(--primary);border-color:var(--border);box-shadow:0 -1px 2px rgba(0,0,0,.03)}
.export-block{border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:14px;background:#fbfcfe}
.export-block h4{margin:0 0 8px;font-size:14px}
.check-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px 14px;margin-bottom:10px}
.check-list label{display:flex;gap:6px;align-items:center;font-size:13px;padding:3px 0}
.status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.sd-on{background:var(--green)}
.sd-will{background:var(--amber)}
.sd-end{background:var(--faint)}

.upload-zone{border:2px dashed var(--border2);border-radius:10px;padding:24px 18px;text-align:center;background:#fbfcfe;cursor:pointer}
.upload-zone:hover{border-color:var(--primary);background:var(--primary-soft)}
.upload-zone .big{font-size:15px;font-weight:700;margin-bottom:6px}
.privacy-badge{font-size:12px;font-weight:700;padding:4px 10px;border-radius:14px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.privacy-badge.local{background:#e6f7f0;color:#17805f}
.privacy-badge.ext{background:var(--red-bg);color:var(--red)}
.privacy-badge .dot{width:8px;height:8px;border-radius:50%;background:currentColor}
.map-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.preview-scroll{max-height:280px;overflow:auto;border:1px solid var(--border);border-radius:6px}
.preview-scroll table th,.preview-scroll table td{white-space:nowrap;font-size:12px}
th.mapped{background:var(--primary-soft);color:var(--primary)}
.import-note{background:var(--primary-soft);border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.import-note b{color:var(--primary)}

@media (max-width:880px){.tl-chart{overflow-x:auto}.tl{flex-direction:column;align-items:stretch}.tl-chart{min-width:500px}.ticks{margin-left:0}.ai-cards{grid-template-columns:1fr}}
</style>
</head>
<body>

<header>
  <div class="head-inner">
    <div class="brand">
      <div class="logo">배치</div>
      <div>
        <div>현장 직원 배치 관리 <span class="pill confirm">프로토타입</span></div>
        <div class="sub">건설사업관리용역 · 계약배치 · 실제배치 · 변경 예정 배치</div>
      </div>
    </div>
    <nav class="tabs">
      <button class="tab active" data-tab="overview" onclick="switchTab('overview')">전체 배치 현황</button>
      <button class="tab" data-tab="manage" onclick="switchTab('manage')">배치 관리</button>
      <button class="tab" data-tab="ai" onclick="switchTab('ai')">AI 점검·요약</button>
    </nav>
    <div class="head-right">
      <span id="privacy-badge" class="privacy-badge local"><span class="dot"></span>로컬 전용</span>
      <button class="icon-btn" title="설정" onclick="openSettings()">⚙</button>
    </div>
  </div>
</header>

<main>
  <section id="view-overview" class="view active"></section>
  <section id="view-manage" class="view"></section>
  <section id="view-ai" class="view"></section>
</main>

<div id="modal-root"></div>
<div id="toast-root" class="toast-wrap"></div>

<script>
const STORAGE_KEY = "siteStaffPlacement.v1";
const KIND = {contract:"계약", actual:"실제", pending:"변경예정"};
const KIND_ORDER = ["contract","actual","pending"];
const KIND_COLOR = {contract:"blue", actual:"green", pending:"amber"};

let state = load();
let ui = {
  tab: "overview",
  ovSite: "all",
  ovSheet: "all",
  ovSearch: "",
  ovKind: "all",
  ovOverlapOnly: false,
  mSub: "sites",
  mSiteFilter: "all",
  mStaffFilter: "all",
  mKindFilter: "all",
  aiResult: null,
  aiSource: "rule",
  aiTime: null,
  import: {step:"pick", file:null, sheets:[], selSheets:new Set(), hasHeader:true, map:{}, result:null, replace:true},
};

function load(){
  // Confidential placement data is intentionally kept in memory only.
  return seed();
}
function save(){
  state.settings = state.settings || {apiKey:"", model:"gemini-2.0-flash", external:false};
  if(state.settings.external==null) state.settings.external=false;
  // No localStorage/sessionStorage/IndexedDB persistence.
}
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function seed(){
  const s1 = {id:"s1", name:"부산오페라하우스", hostRole:"확인필요", consortium:["[확인 필요]"], consortiumStaff:[]};
  const s2 = {id:"s2", name:"제주공항 관제동 신축사업", hostRole:"확인필요", consortium:["[확인 필요]"], consortiumStaff:[]};
  const st = (id,name,job)=>({id,name,job});
  const staff = [
    st("st1","이경민","건축3"), st("st2","남연만","건축4"), st("st3","김재수","토목2"),
    st("st4","서무홍","기계"), st("st5","안남섭","건축 책임"), st("st6","임동환","건축"),
    st("st7","김민석","건축2"), st("st8","박서준","건축5"),
  ];
  const pl = (id,siteId,staffId,kind,start,end,demo)=>({id,siteId,staffId,kind,start,end,demo:!!demo});
  const placements = [
    pl("p1","s1","st1","contract","2025-02-17","2027-03-01"),
    pl("p2","s1","st2","contract","2020-02-07","2027-03-01"),
    pl("p3","s1","st3","contract","2026-02-11","2027-01-16"),
    pl("p4","s1","st4","contract","2026-01-01","2026-08-01"),
    pl("p5","s2","st5","contract","2025-02-01","2026-10-19"),
    pl("p6","s2","st6","contract","2025-02-01","2026-10-29"),
    pl("p7","s1","st7","contract","2026-01-01","2026-12-31",true),
    pl("p8","s2","st7","actual","2026-03-01","2026-09-30",true),
    pl("p9","s2","st7","pending","2026-10-01","2027-12-31",true),
    pl("p10","s1","st8","contract","2026-04-01","2027-03-01",true),
    pl("p11","s1","st8","actual","2026-05-01","2027-02-15",true),
    pl("p12","s1","st3","actual","2026-03-01","2027-01-16",true),
  ];
  const changes = [
    {id:"c1", staffId:"st3", before:{siteName:"부산오페라하우스", start:"2026-01-01", end:"2026-12-31"}, after:{siteName:"부산오페라하우스", start:"2026-02-11", end:"2027-01-16"}, changeDate:"2025-12-20", changeReason:"투입 인원 조정으로 착수일이 연기되었습니다 (예시)", demo:true},
    {id:"c2", staffId:"st7", before:{siteName:"부산오페라하우스", start:"2026-01-01", end:"2026-12-31"}, after:{siteName:"제주공항 관제동 신축사업", start:"2026-10-01", end:"2027-12-31"}, changeDate:"2026-08-05", changeReason:"부산오페라하우스 공정 축소로 제주 관제동으로 전환 예정입니다 (예시)", demo:true},
  ];
  return {version:1, settings:{apiKey:"", model:"gemini-2.0-flash", external:false}, sites:[s1,s2], staff, placements, changes};
}

function siteById(id){ return state.sites.find(s=>s.id===id); }
function staffById(id){ return state.staff.find(s=>s.id===id); }
function placementById(id){ return state.placements.find(p=>p.id===id); }

function fmt(d){ if(!d) return ""; const [y,m,dd]=d.split("-"); return y+"."+m+"."+dd; }
function todayISO(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function statusOf(p){
  const t = todayISO();
  if(p.start <= t && t <= p.end) return {t:"배치중", cls:"sd-on"};
  if(t < p.start) return {t:"예정", cls:"sd-will"};
  return {t:"종료", cls:"sd-end"};
}

function toast(msg,type){
  const el=document.createElement("div");
  el.className="toast "+(type||"");
  el.textContent=msg;
  document.getElementById("toast-root").appendChild(el);
  setTimeout(()=>{ el.style.opacity="0"; el.style.transition="opacity .3s"; setTimeout(()=>el.remove(),320); },3200);
}
function openModal(html,title){
  document.getElementById("modal-root").innerHTML =
    '<div class="modal-backdrop" onclick="if(event.target===this)hideModal()">'+
    '<div class="modal"><div class="modal-head"><h3>'+title+'</h3><button class="icon-btn" onclick="hideModal()">✕</button></div>'+
    '<div class="modal-body">'+html+'</div>'+
    '<div class="modal-foot"><button class="btn" onclick="hideModal()">닫기</button></div></div></div>';
}
function hideModal(){ document.getElementById("modal-root").innerHTML=""; }
function fieldVal(id){ const el=document.getElementById(id); return el ? el.value : ""; }

function switchTab(tab){
  ui.tab=tab;
  document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active", b.dataset.tab===tab));
  document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));

function calcOverlaps(inputPlacements){
  const byStaff={};
  const source=Array.isArray(inputPlacements)?inputPlacements:(Array.isArray(state.placements)?state.placements:[]);
  source.forEach(p=>{ const key=p.staffId+"||"+p.kind; (byStaff[key]=byStaff[key]||[]).push(p); });
  const out=[];
  Object.keys(byStaff).forEach(key=>{
    const ps=byStaff[key].filter(p=>p.start&&p.end);
    const ranges=[];
    for(let i=0;i<ps.length;i++){
      for(let j=i+1;j<ps.length;j++){
        const a=ps[i], b=ps[j];
        if(a.siteId===b.siteId) continue;
        const os=a.start<=b.end&&b.start<=a.end;
        if(!os) continue;
        ranges.push({a,b,start:a.start<b.start?b.start:a.start, end:a.end<b.end?a.end:b.end});
      }
    }
    if(ranges.length){ const sid=ps[0].staffId; out.push({staffId:sid,kind:ps[0].kind,staff:staffById(sid),conflicts:ranges}); }
  });
  return out;
}

function findEOCD(dv){
  const len=dv.byteLength;
  const start=Math.max(0,len-66000);
  for(let i=len-22;i>=start;i--){
    if(dv.getUint32(i,true)===0x06054b50) return i;
  }
  throw new Error("유효한 엑셀(xlsx) 파일이 아닙니다.");
}
function parseCentral(dv,off,count){
  const entries=[]; let p=off;
  for(let n=0;n<count;n++){
    if(dv.getUint32(p,true)!==0x02014b50) break;
    const method=dv.getUint16(p+10,true);
    const csize=dv.getUint32(p+20,true);
    const nlen=dv.getUint16(p+28,true);
    const elen=dv.getUint16(p+30,true);
    const clen=dv.getUint16(p+32,true);
    const lho=dv.getUint32(p+42,true);
    let name="";
    for(let i=0;i<nlen;i++) name+=String.fromCharCode(dv.getUint8(p+46+i));
    entries.push({name:name.replace(/\\/g,"/"),method,csize,lho});
    p+=46+nlen+elen+clen;
  }
  return entries;
}
async function readEntry(buf,entry){
  const dv=new DataView(buf);
  const nlen=dv.getUint16(entry.lho+26,true);
  const elen=dv.getUint16(entry.lho+28,true);
  const dataStart=entry.lho+30+nlen+elen;
  const data=new Uint8Array(buf,dataStart,entry.csize);
  if(entry.method===0) return data;
  if(entry.method===8){
    if(typeof DecompressionStream==="undefined") throw new Error("이 브라우저는 압축된 xlsx를 읽을 수 없습니다. 최신 Chrome/Edge를 사용해 주세요.");
    const ds=new DecompressionStream("deflate-raw");
    const stream=new Blob([data]).stream().pipeThrough(ds);
    return new Uint8Array(await new Response(stream).arrayBuffer());
  }
  throw new Error("지원하지 않는 압축 방식입니다.");
}
function xmlDoc(xml){ return new DOMParser().parseFromString(xml,"application/xml"); }
function colIndex(letters){
  let idx=0;
  for(const ch of letters) idx=idx*26+(ch.charCodeAt(0)-64);
  return idx-1;
}
async function parseXlsx(buf){
  const dv=new DataView(buf);
  const eocd=findEOCD(dv);
  const count=dv.getUint16(eocd+10,true);
  const cdOff=dv.getUint32(eocd+16,true);
  const entries=parseCentral(dv,cdOff,count);
  const byName={};
  entries.forEach(e=>byName[e.name]=e);
  const dec=new TextDecoder("utf-8");
  const get=name=>{ const e=byName[name]; return e?readEntry(buf,e):null; };
  const wbRaw=await get("xl/workbook.xml");
  const relsRaw=await get("xl/_rels/workbook.xml.rels");
  const ssRaw=await get("xl/sharedStrings.xml");
  if(!wbRaw||!relsRaw) throw new Error("엑셀 내부 구조를 읽지 못했습니다.");
  const wb=xmlDoc(dec.decode(wbRaw));
  const wbPr=wb.querySelector("workbookPr");
  const date1904=!!(wbPr&&wbPr.getAttribute("date1904")==="1");
  const sheets=[];
  wb.querySelectorAll("sheet").forEach(sh=>{ sheets.push({rid:sh.getAttribute("r:id"), name:sh.getAttribute("name")||"시트"}); });
  const rels=xmlDoc(dec.decode(relsRaw));
  const targetByRid={};
  rels.querySelectorAll("Relationship").forEach(r=>{ targetByRid[r.getAttribute("Id")]=r.getAttribute("Target"); });
  const shared=[];
  if(ssRaw){ const ss=xmlDoc(dec.decode(ssRaw)); ss.querySelectorAll("si").forEach(si=>{ shared.push(si.textContent||""); }); }
  const out=[];
  for(const sh of sheets){
    const t=targetByRid[sh.rid];
    if(!t) continue;
    const target= t.indexOf("xl/")===0 ? t : (t.indexOf("/")===0 ? t.replace(/^\//,"") : "xl/"+t);
    const raw=await get(target);
    if(!raw) continue;
    const doc=xmlDoc(dec.decode(raw));
    const rows=[];
    doc.querySelectorAll("sheetData row").forEach(tr=>{
      const cells=[];
      cells.sourceRow=parseInt(tr.getAttribute("r")||"0",10)||null;
      tr.querySelectorAll("c").forEach(c=>{
        const ref=c.getAttribute("r")||"";
        const idx=colIndex(ref.replace(/[0-9]/g,""));
        const typ=c.getAttribute("t");
        const v=c.querySelector("v");
        let val=null;
        if(typ==="s"&&v) val=shared[parseInt(v.textContent,10)];
        else if(typ==="inlineStr"){ const is=c.querySelector("is"); val=is?is.textContent:""; }
        else if(typ==="str"&&v) val=v.textContent;
        else if(typ==="b") val=v?v.textContent==="1":null;
        else if(v){ const n=parseFloat(v.textContent); val=isNaN(n)?v.textContent:n; }
        if(val!=null&&val!=="") cells.push({i:idx,val});
      });
      if(cells.length) rows.push(cells);
    });
    out.push({name:sh.name, rows});
  }
  if(!out.length) throw new Error("데이터가 있는 시트를 찾지 못했습니다.");
  return {sheets:out, date1904};
}
function detectDelim(text){
  const first=text.split(/\r?\n/)[0]||"";
  const cand=[",",";","\t"].map(d=>({d,c:(first.split(d).length-1)})).sort((a,b)=>b.c-a.c);
  return cand[0].c>0?cand[0].d:",";
}
function cellNum(v){
  const t=String(v).trim();
  if(t!==""&&/^[-+]?\d+(\.\d+)?$/.test(t)) return parseFloat(t);
  return t;
}
function parseCSV(text){
  text=text.replace(/^\uFEFF/,"");
  const delim=detectDelim(text);
  const rows=[]; let row=[], cur="", inQ=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(inQ){ if(ch==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else inQ=false; } else cur+=ch; }
    else if(ch==='"') inQ=true;
    else if(ch===delim){ row.push(cur); cur=""; }
    else if(ch==="\n"){ row.push(cur); cur=""; if(row.some(c=>c.trim()!=="")) rows.push(row); row=[]; }
    else if(ch!=="\r") cur+=ch;
  }
  if(cur!==""||row.length){ row.push(cur); if(row.some(c=>c.trim()!=="")) rows.push(row); }
  const grid=rows.map((r,rowIndex)=>{const cells=r.map((v,i)=>({i,val:cellNum(v)}));cells.sourceRow=rowIndex+1;return cells;});
  if(!grid.length) throw new Error("CSV에 읽을 데이터가 없습니다.");
  return {sheets:[{name:"시트1", rows:grid}], date1904:false};
}
async function parseWorkbook(file){
  const buf=await file.arrayBuffer();
  const lower=file.name.toLowerCase();
  if(lower.endsWith(".csv")){
    let text=new TextDecoder("utf-8").decode(buf);
    if(text.indexOf("\uFFFD")>=0){ try{ text=new TextDecoder("euc-kr").decode(buf); }catch(e){} }
    return parseCSV(text);
  }
  if(lower.endsWith(".xlsx")||lower.endsWith(".xlsm")) return parseXlsx(buf);
  throw new Error("지원 형식은 .xlsx / .xlsm / .csv 입니다. 구버전 .xls는 Excel에서 [다른 이름으로 저장 > .xlsx]로 저장해 주세요.");
}
function pad2(n){ return String(n).padStart(2,"0"); }
function dateFromExcel(n,date1904){
  const serial=date1904?n+1462:n;
  const d=new Date(Date.UTC(1899,11,30)+Math.round(serial)*86400000);
  return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate());
}
function normDate(v){
  if(v==null||v==="") return null;
  if(typeof v==="number"){ if(!isFinite(v)) return null; return dateFromExcel(v,!!(ui.import&&ui.import.date1904)); }
  const s=String(v).replace(/[\u00A0\u200B\u3000\uFEFF]/g," ").trim();
  if(!s) return null;
  let m=s.match(/(\d{4})\s*[.\-\/년\s]\s*(\d{1,2})\s*[.\-\/월\s]\s*(\d{1,2})[일\s]*(?:[\sT\-].*)?/);
  if(m) return m[1]+"-"+pad2(m[2])+"-"+pad2(m[3]);
  m=s.match(/^(\d{4})(\d{2})(\d{2})/);
  if(m) return m[1]+"-"+m[2]+"-"+m[3];
  m=s.match(/^(\d{1,2})\s*[.\-\/]\s*(\d{1,2})\s*[.\-\/]\s*(\d{4})\b/);
  if(m&&parseInt(m[1],10)<=31&&parseInt(m[2],10)<=12) return m[3]+"-"+pad2(m[2])+"-"+pad2(m[1]);
  return null;
}
function splitRange(v){
  if(typeof v==="string"){
    const m=v.match(/(\d{4}[.\-\/]\d{1,2}[.\-\/]\d{1,2})\s*[~\-～–\s]+\s*(\d{4}[.\-\/]\d{1,2}[.\-\/]\d{1,2})/);
    if(m) return [normDate(m[1]), normDate(m[2])];
  }
  return [normDate(v), null];
}
function normKind(v){
  if(v==null||v==="") return "contract";

function dateReadCheck(){

      sample.push(sh.rows[r]);
      if(sample.length>=cap) break;
    }
    if(sample.length>=cap) break;
  }
  const count=idx=>{
    if(idx==null||idx<0) return null;
    let ok=0,total=0;
    sample.forEach(row=>{
      const c=row.find(x=>x.i===idx);

  };

function importRows(){
  const imp=ui.import;
  const map=imp.map;
  if(imp.selSheets.size===0){ toast("가져올 시트를 선택해 주세요.","err"); return; }
  if(map.site==null||map.staff==null||map.start==null||map.end==null){ toast("현장명·직원명·시작일·종료일 컬럼을 모두 지정해 주세요.","err"); return; }
  if(imp.replace){ state.sites=[]; state.staff=[]; state.placements=[]; state.changes=[]; }
  const siteMap={}, staffMap={};
  const addSite=n=>{ if(!siteMap[n]){ siteMap[n]={id:uid(),name:n,hostRole:"확인필요",consortium:["[확인 필요]"],consortiumStaff:[]}; state.sites.push(siteMap[n]); } return siteMap[n].id; };
  const addStaff=(n,j)=>{ if(!staffMap[n]){ staffMap[n]={id:uid(),name:n,job:j||""}; state.staff.push(staffMap[n]); } else if(j&&!staffMap[n].job){ staffMap[n].job=j; } return staffMap[n].id; };
  let imported=0, skipped=0;
  const skipReasons={};
  const usedStaff=new Set();
  const g=(row,idx)=>{ if(idx==null||idx<0) return null; const c=row.find(x=>x.i===idx); return c?c.val:null; };
  for(const sh of imp.sheets){
    if(!imp.selSheets.has(sh.name)) continue;
    const rows=sh.rows;
    for(let r=0;r<rows.length;r++){
      if(imp.hasHeader&&r===0) continue;
      const row=rows[r];
      const siteRaw=g(row,map.site), staffRaw=g(row,map.staff), jobRaw=g(row,map.job), kindRaw=g(row,map.kind);
      let startRaw=g(row,map.start), endRaw=g(row,map.end);
      if(map.start===map.end&&startRaw!=null){
        const sr=splitRange(startRaw);
        startRaw=sr[0]; if(endRaw==null||endRaw==="") endRaw=sr[1];
      }
      const start=splitRange(startRaw)[0];
      const end=normDate(endRaw);
      const site=siteRaw!=null?String(siteRaw).trim():"";
      const staff=staffRaw!=null?String(staffRaw).trim():"";
      const job=jobRaw!=null?String(jobRaw).trim():"";
      const reasons=[];
      if(!site) reasons.push("현장명 없음");
      if(!staff) reasons.push("직원명 없음");
      if(!start) reasons.push("시작일 누락/형식 오류");
      if(!end) reasons.push("종료일 누락/형식 오류");
      if(start&&end&&end<start) reasons.push("기간 역전(종료<시작)");
      if(reasons.length){ skipped++; const key=reasons.join(", "); skipReasons[key]=(skipReasons[key]||0)+1; continue; }
      const sid=addSite(site), stid=addStaff(staff,job);
      state.placements.push({id:uid(),siteId:sid,staffId:stid,kind:normKind(kindRaw),start,end,imported:true});
      usedStaff.add(stid);
      imported++;
    }
  }
  save();
  const overlaps=calcOverlaps().filter(o=>usedStaff.has(o.staffId));
  const dupCount=overlaps.reduce((s,o)=>s+o.conflicts.length,0);
  imp.result={imported,skipped,skipReasons,dupCount,dupStaff:overlaps.map(o=>o.staff.name)};
  imp.step="done";
  renderOverview();
  if(dupCount) toast(imported+"건 가져오기 완료. 중복 배치 "+dupCount+"건 발견되었습니다!","err");
  else toast(imported+"건 가져오기 완료. 중복이 없습니다.","ok");
}

function rangeFrom(list){
  let min=null,max=null;
  list.forEach(p=>{ if(p.start&&p.end){ if(!min||p.start<min)min=p.start; if(!max||p.end>max)max=p.end; } });
  if(!min||!max){ const t=todayISO(); min=max=t; }
  const dmin=new Date(min+"T00:00:00"); dmin.setDate(1);
  const dmax=new Date(max+"T00:00:00"); dmax.setMonth(dmax.getMonth()+1,0);
  return {min:dmin,max:dmax,minI:dmin.getTime(),maxI:dmax.getTime()};
}
function pos(iso,rng,asEnd){
  const t=new Date(iso+"T00:00:00").getTime()+(asEnd?86400000:0);
  return Math.max(0,Math.min(1,(t-rng.minI)/(rng.maxI-rng.minI||1)));
}
function barStyle(s,e,rng){
  const l=pos(s,rng,false)*100, w=(pos(e,rng,true)-pos(s,rng,false))*100;
  return "left:"+l.toFixed(3)+"%;width:"+Math.max(0.4,w).toFixed(3)+"%";
}
function monthTicks(rng){
  const out=['<div class="ticks">'];
  const step=Math.max(1,Math.ceil(monthsBetween(rng.min,rng.max)/10));
  let d=new Date(rng.min);
  let i=0;
  while(d<=rng.max){
    if(i%step===0){
      const pct=pos(toISOMonth(d)+"-01",rng,false)*100;
      out.push('<span style="left:'+pct.toFixed(2)+'%">'+d.getFullYear()+'.'+String(d.getMonth()+1).padStart(2,"0")+'</span>');
    }
    d=new Date(d.getFullYear(),d.getMonth()+1,1); i++;
  }
  out.push('</div>');
  return out.join("");
}
function toISOMonth(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); }
function monthsBetween(a,b){ return (b.getFullYear()-a.getFullYear())*12+(b.getMonth()-a.getMonth())+1; }

function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function savePlacement(){
  const id=fieldVal("pl-id");
  const old=id?placementById(id):null;
  const staffId=fieldVal("pl-staff"), siteId=fieldVal("pl-site");
  const kind=fieldVal("pl-kind");
  const start=fieldVal("pl-start"), end=fieldVal("pl-end");
  if(!staffId){ toast("직원을 선택해 주세요.","err"); return; }
  if(!siteId){ toast("현장을 선택해 주세요.","err"); return; }
  if(!start){ toast("배치 시작일을 입력해 주세요.","err"); return; }
  if(!end){ toast("배치 종료일을 입력해 주세요.","err"); return; }
  if(end<start){ toast("종료일이 시작일보다 빠릅니다. 기간을 확인해 주세요.","err"); return; }
  const contractDone=document.getElementById("pl-contract-done")&&document.getElementById("pl-contract-done").checked;
  const chgDate=fieldVal("pl-chg-date")||todayISO();
  const chgReason=fieldVal("pl-chg-reason").trim()||"변경 사유 미기록";

  if(old){
    const changed=(old.siteId!==siteId||old.start!==start||old.end!==end);
    const contractCompleted=contractDone&&(old.kind==="pending"||kind==="pending");
    const effectiveKind = contractCompleted ? "contract" : kind;
    const siteN=siteById(siteId).name;
    const oldSiteN=siteById(old.siteId).name;
    if(changed || contractCompleted){
      const before={siteName:oldSiteN, start:old.start, end:old.end};
      state.changes.push({id:uid(),staffId:old.staffId,before,after:{siteName:siteN,start,end},changeDate:chgDate,changeReason:chgReason,demo:old.demo});
    }
    old.siteId=siteId; old.start=start; old.end=end; old.kind=effectiveKind;
  }else{
    state.placements.push({id:uid(),siteId,staffId,kind,start,end,demo:false});
    const reason=fieldVal("pl-chg-reason").trim();
    if(reason&&reason!=="변경 사유 미기록"){
      const siteN=siteById(siteId).name;
      state.changes.push({id:uid(),staffId,before:null,after:{siteName:siteN,start,end},changeDate:chgDate,changeReason:reason,demo:false});
    }
  }
  save(); hideModal(); renderManage(); toast("저장되었습니다.","ok");
}
function delPlacement(id){
  if(!confirm("이 배치를 삭제할까요?")) return;
  state.placements=state.placements.filter(p=>p.id!==id);

}

function buildDiffForStaff(sid){
  const c=state.placements.filter(p=>p.staffId===sid&&p.kind==="contract");

  if(!c.length&&!a.length) return '<div class="muted small">계약배치와 실제배치가 모두 없습니다.</div>';

function xlsEscape(s){
  return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
let crcTable=null;
function crc32(data){
  if(!crcTable){
    crcTable=new Uint32Array(256);
    for(let n=0;n<256;n++){
      let c=n;
      for(let k=0;k<8;k++) c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);
      crcTable[n]=c>>>0;
    }
  }
  let c=0xFFFFFFFF;
  for(let i=0;i<data.length;i++) c=(crcTable[(c^data[i])&0xFF]^(c>>>8))>>>0;
  return (c^0xFFFFFFFF)>>>0;
}
async function deflateRaw(bytes){
  if(typeof CompressionStream==="undefined") throw new Error("이 브라우저는 xlsx 생성이 불가능합니다. 최신 Chrome/Edge를 사용해 주세요.");
  const cs=new CompressionStream("deflate-raw");
  const stream=new Blob([bytes]).stream().pipeThrough(cs);
  return new Uint8Array(await new Response(stream).arrayBuffer());
}
async function makeZip(files){
  const enc=new TextEncoder();
  const localParts=[], centralParts=[];
  let offset=0;
  for(const f of files){
    const nameBytes=enc.encode(f.name);
    const comp=await deflateRaw(f.data);
    const crc=crc32(f.data);
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true);
    lh.setUint16(4,20,true);
    lh.setUint16(6,0x0800,true);
    lh.setUint16(8,8,true);
    lh.setUint32(14,crc,true);
    lh.setUint32(18,comp.length,true);
    lh.setUint32(22,f.data.length,true);
    lh.setUint16(26,nameBytes.length,true);
    lh.setUint16(28,0,true);
    const local=new Uint8Array(30+nameBytes.length+comp.length);
    local.set(new Uint8Array(lh.buffer),0);
    local.set(nameBytes,30);
    local.set(comp,30+nameBytes.length);
    localParts.push(local);
    const ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true);
    ch.setUint16(4,20,true);
    ch.setUint16(6,20,true);
    ch.setUint16(8,0x0800,true);
    ch.setUint16(10,8,true);
    ch.setUint32(16,crc,true);
    ch.setUint32(20,comp.length,true);
    ch.setUint32(24,f.data.length,true);
    ch.setUint16(28,nameBytes.length,true);
    ch.setUint32(42,offset,true);
    const cent=new Uint8Array(46+nameBytes.length);
    cent.set(new Uint8Array(ch.buffer),0);
    cent.set(nameBytes,46);
    centralParts.push(cent);
    offset+=local.length;
  }
  const cdSize=centralParts.reduce((s,p)=>s+p.length,0);
  const eocd=new DataView(new ArrayBuffer(22));
  eocd.setUint32(0,0x06054b50,true);
  eocd.setUint16(8,files.length,true);
  eocd.setUint16(10,files.length,true);
  eocd.setUint32(12,cdSize,true);
  eocd.setUint32(16,offset,true);
  const out=new Uint8Array(offset+cdSize+22);
  let p=0;
  localParts.forEach(x=>{ out.set(x,p); p+=x.length; });
  centralParts.forEach(x=>{ out.set(x,p); p+=x.length; });
  out.set(new Uint8Array(eocd.buffer),p);
  return out;
}
function colLetter(n){
  let s=""; n++;
  while(n>0){ const m=(n-1)%26; s=String.fromCharCode(65+m)+s; n=Math.floor((n-1)/26); }
  return s;
}
function serialFromISO(iso){
  const t=Date.parse(iso+"T00:00:00Z");
  return Math.floor((t-Date.UTC(1899,11,30))/86400000);
}
function sheetXml(rows){
  let s='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
  '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'+
  '<sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>'+
  '<sheetFormatPr defaultRowHeight="15"/><sheetData>';
  rows.forEach((r,ri)=>{
    s+='<row r="'+(ri+1)+'">';
    r.forEach((v,ci)=>{
      if(v==null||v==="") return;
      const ref=colLetter(ci)+(ri+1);
      if(typeof v==="object"&&v&&v.d){
        s+='<c r="'+ref+'" s="1"><v>'+serialFromISO(v.d)+'</v></c>';
      }else if(typeof v==="number"){
        s+='<c r="'+ref+'"><v>'+v+'</v></c>';
      }else{
        s+='<c r="'+ref+'" t="inlineStr"'+(ri===0?' s="2"':'')+'><is><t xml:space="preserve">'+xlsEscape(v)+'</t></is></c>';
      }
    });
    s+='</row>';
  });
  s+='</sheetData></worksheet>';
  return s;
}

  '<borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders>'+

  '</cellXfs>'+
  '<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles>'+
  '</styleSheet>';

function contentTypesXml(n){
  let s='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
  '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'+
  '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'+
  '<Default Extension="xml" ContentType="application/xml"/>'+
  '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>';
  for(let i=1;i<=n;i++) s+='<Override PartName="/xl/worksheets/sheet'+i+'.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>';
  s+='<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>'+
  '<Override PartName="/docProps/core.xml" ContentType="application/vnd.openxmlformats-package.core-properties+xml"/>'+
  '<Override PartName="/docProps/app.xml" ContentType="application/vnd.openxmlformats-officedocument.extended-properties+xml"/>'+
  '</Types>';
  return s;
}
function rootRelsXml(){
  return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+
  '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>'+
  '<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/package/2006/relationships/metadata/core-properties" Target="docProps/core.xml"/>'+
  '<Relationship Id="rId3" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/extended-properties" Target="docProps/app.xml"/>'+

function workbookXml(names){
  let s='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
  '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>';
  names.forEach((n,i)=>{ s+='<sheet name="'+xlsEscape(n)+'" sheetId="'+(i+1)+'" r:id="rId'+(i+1)+'"/>'; });
  s+='</sheets></workbook>';
  return s;
}
function workbookRelsXml(n){
  let s='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">';
  for(let i=1;i<=n;i++) s+='<Relationship Id="rId'+i+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet'+i+'.xml"/>';
  s+='<Relationship Id="rId'+(n+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>';
  s+='</Relationships>';
  return s;
}
function coreXml(){
  const now=new Date().toISOString();
  return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
  '<cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:dcterms="http://purl.org/dc/terms/" xmlns:dcmitype="http://purl.org/dc/dcmitype/" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">'+
  '<dc:creator>cm-staff-placement</dc:creator><cp:lastModifiedBy>cm-staff-placement</cp:lastModifiedBy>'+
  '<dcterms:created xsi:type="dcterms:W3CDTF">'+now+'</dcterms:created>'+
  '<dcterms:modified xsi:type="dcterms:W3CDTF">'+now+'</dcterms:modified></cp:coreProperties>';
}
function appXml(){
  return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Properties xmlns="http://schemas.openxmlformats.org/officeDocument/2006/extended-properties" xmlns:vt="http://schemas.openxmlformats.org/officeDocument/2006/docPropsVTypes"><Application>cm-staff-placement</Application><DocSecurity>0</DocSecurity><Company>cm-staff-placement</Company><AppVersion>1.0</AppVersion></Properties>';
}
async function buildXlsx(sheets){
  const enc=new TextEncoder();
  const sanitize=name=>String(name).replace(/[\\\/\?\*\[\]:]/g,"_").replace(/^(_+|')/,"").slice(0,31);
  const files=[
    {name:"[Content_Types].xml", data:enc.encode(contentTypesXml(sheets.length))},
    {name:"_rels/.rels", data:enc.encode(rootRelsXml())},
    {name:"xl/workbook.xml", data:enc.encode(workbookXml(sheets.map(s=>sanitize(s.name))))},
    {name:"xl/_rels/workbook.xml.rels", data:enc.encode(workbookRelsXml(sheets.length))},
    {name:"xl/styles.xml", data:enc.encode(stylesXml())}
  ];
  sheets.forEach((sh,i)=>{ files.push({name:"xl/worksheets/sheet"+(i+1)+".xml", data:enc.encode(sheetXml(sh.rows))}); });
  files.push({name:"docProps/core.xml", data:enc.encode(coreXml())});
  files.push({name:"docProps/app.xml", data:enc.encode(appXml())});
  return makeZip(files);
}
function downloadBytes(name,bytes){
  const blob=new Blob([bytes],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },500);
}

    '<div class="field"><label>데이터 관리</label><div class="btn-row"><button class="btn sm" onclick="resetDemo()">예시 데이터 다시 불러오기</button><button class="btn sm danger" onclick="clearAll()">전체 데이터 지우기</button></div><div class="hint">데이터는 브라우저에 임시 저장됩니다.</div></div>'+
    '<div class="btn-row"><button class="btn primary" onclick="saveSettings()">설정 저장</button></div>',

function buildFacts(){
  const overlaps=calcOverlaps().map(o=>({
    staffId:o.staffId, staffName:o.staff.name, job:o.staff.job,
    conflicts:o.conflicts.map(c=>({
      siteA:siteById(c.a.siteId).name, siteB:siteById(c.b.siteId).name,
      start:c.start, end:c.end, days:Math.round((new Date(c.end)-new Date(c.start))/86400000)+1
    }))
  }));
  const changes=state.changes.map(c=>({
    staffId:c.staffId, staffName:staffById(c.staffId)?staffById(c.staffId).name:"?",
    before:c.before, after:c.after, changeDate:c.changeDate, changeReason:c.changeReason||"변경 사유 미기록",
    basis:changeBasis(c), demo:!!c.demo
  }));
  const diffs=[];
  const byStaff={};
  state.placements.forEach(p=>{ (byStaff[p.staffId]=byStaff[p.staffId]||[]).push(p); });
  Object.keys(byStaff).forEach(sid=>{
    const ps=byStaff[sid];
    const contracts=ps.filter(p=>p.kind==="contract");
    const actuals=ps.filter(p=>p.kind==="actual");
    if(!contracts.length&&!actuals.length) return;
    const st=staffById(sid);
    contracts.forEach(cc=>{
      const same=actuals.find(a=>a.siteId===cc.siteId);
      if(same){
        const samePeriod=same.start===cc.start&&same.end===cc.end;
        diffs.push({staffId:sid, staffName:st.name, job:st.job, site:siteById(cc.siteId).name,
          contract:{start:cc.start,end:cc.end}, actual:{start:same.start,end:same.end},
          kind:samePeriod?"same":"period"});
      }else{
        diffs.push({staffId:sid, staffName:st.name, job:st.job, site:siteById(cc.siteId).name,
          contract:{start:cc.start,end:cc.end}, actual:null, kind:"noActual"});
      }
    });
    actuals.forEach(a=>{
      const match=contracts.find(c=>c.siteId===a.siteId);
      if(!match){
        diffs.push({staffId:sid, staffName:st.name, job:st.job, site:siteById(a.siteId).name,
          contract:null, actual:{start:a.start,end:a.end}, kind:"noContract"});
      }
    });
  });
  return {overlaps,changes,diffs};
}
function changeBasis(c){
  if(!c||!c.after) return ["변경 후 정보 확인 필요"];
  if(!c.before) return ["배치 관리에서 신규 배치와 변경 사유를 함께 저장한 기록"];
  const rules=[];
  if(String(c.before.siteName||"").trim()!==String(c.after.siteName||"").trim()) rules.push("현장명 변경: "+(c.before.siteName||"[없음]")+" → "+(c.after.siteName||"[없음]"));
  if(c.before.start&&c.after.start&&c.before.start!==c.after.start) rules.push("시작일 변경: "+c.before.start+" → "+c.after.start+(c.after.start>c.before.start?" (뒤로 이동)":" (앞으로 이동)"));
  if(c.before.end&&c.after.end&&c.before.end!==c.after.end) rules.push("종료일 변경: "+c.before.end+" → "+c.after.end+(c.after.end>c.before.end?" (연장)":" (단축)"));
  return rules.length?rules:["배치 관리에서 저장된 변경 이력(현장·기간 차이 없음)"];
}
function ruleSummary(kind,item){
  if(kind==="overlap") return item.staffName+"님이 "+item.conflicts[0].siteA+"와 "+item.conflicts[0].siteB+"에 동시에 배치되어 있습니다. 겹치는 기간은 "+fmt(item.conflicts[0].start)+" ~ "+fmt(item.conflicts[0].end)+" ("+item.conflicts[0].days+"일)입니다.";
  if(kind==="change"){
    const b=item.before? (item.before.siteName+"("+fmt(item.before.start)+"~"+fmt(item.before.end)+")") : "신규 배치";
    return item.staffName+"님의 배치가 "+b+"에서 "+item.after.siteName+"("+fmt(item.after.start)+"~"+fmt(item.after.end)+")로 변경되었습니다. 변경일 "+fmt(item.changeDate)+", 사유: "+item.changeReason+".";
  }
  if(kind==="diff"){
    if(item.kind==="noActual") return "계약배치("+fmt(item.contract.start)+"~"+fmt(item.contract.end)+")가 있지만 실제배치가 입력되지 않아 비교할 수 없습니다. 확인 필요.";
    if(item.kind==="noContract") return "실제배치("+fmt(item.actual.start)+"~"+fmt(item.actual.end)+")만 존재합니다. 추가 투입 가능성이 있어 확인이 필요합니다.";
    if(item.kind==="same") return "계약배치와 실제배치가 동일합니다. 차이 없음.";
    return "기간 변경: 계약배치("+fmt(item.contract.start)+"~"+fmt(item.contract.end)+") → 실제배치("+fmt(item.actual.start)+"~"+fmt(item.actual.end)+").";
  }
  return "";
}
function computeAI(){
  const facts=buildFacts();
  const out={overlaps:facts.overlaps.map(i=>({...i,summary:ruleSummary("overlap",i)})),
             changes:facts.changes.map(i=>({...i,summary:ruleSummary("change",i)})),
             diffs:facts.diffs.map(i=>({...i,summary:ruleSummary("diff",i)}))};
  return out;
}
async function enhanceWithGemini(result){
  if(!(state.settings&&state.settings.external)||!state.settings.apiKey) return {result, used:false};
  const model=state.settings.model||"gemini-2.0-flash";
  const prompt={
    instruction:"주어진 배치 데이터만을 바탕으로 요약하세요. 데이터에 없는 내용을 절대 만들지 마세요. 정보가 부족하면 \"확인 필요\"라고 표현하세요. 각 항목의 summary는 한국어 1~2문장으로 작성하세요. 반드시 같은 개수·같은 순서로 배열을 반환하세요.",
    data:result
  };
  try{
    throw new Error("외부 전송 기능이 비활성화되었습니다.");
    const res=await Promise.reject("external network disabled",{
      method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({contents:[{parts:[{text:JSON.stringify(prompt)}]}],generationConfig:{responseMimeType:"application/json",temperature:0.2}})
    });
    if(!res.ok) throw new Error("HTTP "+res.status);
    const data=await res.json();
    const txt=data.candidates&&data.candidates[0]&&data.candidates[0].content&&data.candidates[0].content.parts[0].text;
    if(!txt) throw new Error("no text");
    const parsed=JSON.parse(txt.replace(/```json|```/g,""));
    const m=parsed;
    if(m.overlaps&&Array.isArray(m.overlaps)) m.overlaps.forEach((s,i)=>{ if(s&&s.summary&&result.overlaps[i]) result.overlaps[i].summary=s.summary; });
    if(m.changes&&Array.isArray(m.changes)) m.changes.forEach((s,i)=>{ if(s&&s.summary&&result.changes[i]) result.changes[i].summary=s.summary; });
    if(m.diffs&&Array.isArray(m.diffs)) m.diffs.forEach((s,i)=>{ if(s&&s.summary&&result.diffs[i]) result.diffs[i].summary=s.summary; });
    return {result,used:true};
  }catch(e){
    return {result,used:false,error:String(e)};
  }
}

function aiItemDiff(d){

    '<div class="ai-card-body">'+(r.diffs.length? r.diffs.map(aiItemDiff).join("") : '<div class="empty" style="padding:18px">비교할 배치가 없습니다.</div>')+'</div></div>';

  html+='</div>';
  document.getElementById("ai-results").innerHTML=html;
}

function safe(v,fallback=""){ return v===undefined||v===null?fallback:String(v); }
function normalizeText(v){ return safe(v).replace(/[\u00a0\u200b\u3000\ufeff]/g," ").replace(/[\r\n\t]+/g," ").replace(/\s+/g," ").trim(); }
function normalizeHeader(v){ return normalizeText(v).toLowerCase().replace(/[()（）\[\]{}\s_\-./\\:·]/g,""); }
function headerField(v){ const n=normalizeHeader(v); for(const [key,list] of Object.entries(HEADER_ALIASES)) if(list.some(x=>normalizeHeader(x)===n)) return key; return null; }
function employeeKey(r){ const id=normalizeText(r.employeeId); return id?"id:"+id.toLowerCase():"name:"+normalizeText(r.employeeName).toLowerCase(); }
function siteKey(v){ return normalizeText(v).toLowerCase(); }
function validISO(v){ return /^\d{4}-\d{2}-\d{2}$/.test(safe(v))&&!isNaN(new Date(v+"T00:00:00").getTime()); }
function parseDateValue(v,date1904){
  if(v instanceof Date&&!isNaN(v)){ return v.getFullYear()+"-"+pad2(v.getMonth()+1)+"-"+pad2(v.getDate()); }
  if(typeof v==="number"&&isFinite(v)) return dateFromExcel(v,!!date1904);

  if(!m) m=s.match(/^(\d{4})(\d{2})(\d{2})/);
  if(!m) return "";

}
function kindLabel(v){ const s=normalizeText(v); if(/실제/.test(s))return "실제배치"; if(/예정|변경|수정|조정/.test(s))return "변경 예정 배치"; if(/계약/.test(s)||!s)return "계약배치"; return s; }
function kindCode(v){ const s=kindLabel(v); return s==="실제배치"?"actual":s==="변경 예정 배치"?"pending":"contract"; }
function statusLabel(r){ if(!validISO(r.startDate)||!validISO(r.endDate)||r.endDate<r.startDate)return "확인 필요"; const t=todayISO(); return t<r.startDate?"배치 예정":t>r.endDate?"배치 종료":"배치 중"; }
function rowMap(row){ const o={}; (Array.isArray(row)?row:[]).forEach(c=>{if(c&&Number.isInteger(c.i))o[c.i]=c.val;}); return o; }
function findHeader(sheet){
  const rows=Array.isArray(sheet&&sheet.rows)?sheet.rows:[]; let best={index:-1,score:0,map:{},headers:{}};
  rows.slice(0,30).forEach((row,index)=>{ const vals=rowMap(row), map={},headers={}; let score=0;
    Object.keys(vals).forEach(i=>{ const h=normalizeText(vals[i]); headers[i]=h; const f=headerField(h); if(f&&!Object.prototype.hasOwnProperty.call(map,f)){map[f]=Number(i);score++;} });
    if(score>best.score)best={index,score,map,headers};

}
function findMultiRowPlacementLayout(sheet){
  const rows=Array.isArray(sheet&&sheet.rows)?sheet.rows:[];
  for(let upper=0;upper<Math.min(30,rows.length);upper++){
    const top=rowMap(rows[upper]), topEntries=Object.entries(top).map(([i,v])=>[Number(i),normalizeHeader(v)]);
    const employee=topEntries.find(([,v])=>v==="성명"||v==="직원명"||v==="이름");
    const site=topEntries.find(([,v])=>v==="프로젝트명"||v==="현장명"||v==="사업명");
    if(!employee||!site)continue;
    const roleCandidates=topEntries.filter(([,v])=>v.includes("공종")||v.includes("직무")||v.includes("직급"));
    const role=(roleCandidates.find(([,v])=>v.includes("배치계획"))||roleCandidates.at(-1)||[])[0];
    const contractParent=topEntries.find(([,v])=>v.includes("계약서기준")||v.includes("계약배치"));
    const actualParent=topEntries.find(([,v])=>v.includes("실배치")||v.includes("실제배치"));
    for(let lower=upper+1;lower<Math.min(rows.length,upper+5);lower++){
      const sub=rowMap(rows[lower]), subEntries=Object.entries(sub).map(([i,v])=>[Number(i),normalizeHeader(v)]);
      const starts=subEntries.filter(([,v])=>v==="투입"||v==="시작일"||v==="착수일").map(x=>x[0]);
      const ends=subEntries.filter(([,v])=>v==="철수"||v==="종료일"||v==="완료일").map(x=>x[0]);
      if(starts.length<1||ends.length<1)continue;
      const after=(arr,parent)=>arr.find(i=>parent==null||i>=parent);
      const contractStart=after(starts,contractParent&&contractParent[0]),contractEnd=after(ends,contractParent&&contractParent[0]);
      const actualStart=after(starts,actualParent&&actualParent[0]),actualEnd=after(ends,actualParent&&actualParent[0]);
      if(contractStart==null||contractEnd==null)return null;
      return {headerIndex:lower,topIndex:upper,employeeName:employee[0],siteName:site[0],role:role??null,contractStart,contractEnd,actualStart:actualParent?actualStart:null,actualEnd:actualParent?actualEnd:null};

}
function sourceFingerprint(r){ return [employeeKey(r),siteKey(r.siteName),r.startDate,r.endDate,normalizeText(r.assignmentType)].join("|"); }
function ensureLegacyState(){

  allAssignments.filter(r=>!r.excludedReason).forEach(r=>{
    const sk=siteKey(r.siteName); if(!sites.has(sk)){const x={id:uid(),name:r.siteName,hostRole:"확인필요",consortium:[],consortiumStaff:[]};sites.set(sk,x);state.sites.push(x);}
    const ek=employeeKey(r); if(!staff.has(ek)){const x={id:uid(),employeeId:r.employeeId,name:r.employeeName,job:r.role};staff.set(ek,x);state.staff.push(x);}
    const p={id:r.rowId||uid(),siteId:sites.get(sk).id,staffId:staff.get(ek).id,kind:kindCode(r.assignmentType),start:r.startDate,end:r.endDate,sourceFile:r.sourceFile,sourceSheet:r.sourceSheet,sourceRow:r.sourceRow,originalData:r.originalData,rowRef:r};

function calculateAssignmentOverlaps(rows){
  const groups=new Map(),out=[]; rows.filter(r=>!r.excludedReason&&validISO(r.startDate)&&validISO(r.endDate)&&r.endDate>=r.startDate).forEach(r=>{const k=employeeKey(r)+"||"+kindCode(r.assignmentType);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(r);});
  groups.forEach((list,key)=>{for(let i=0;i<list.length;i++)for(let j=i+1;j<list.length;j++){const a=list[i],b=list[j];if(siteKey(a.siteName)===siteKey(b.siteName))continue;if(a.startDate<=b.endDate&&b.startDate<=a.endDate)out.push({employeeKey:key,a,b,start:a.startDate>b.startDate?a.startDate:b.startDate,end:a.endDate<b.endDate?a.endDate:b.endDate});}}); return out;
}
function overlapSet(){ const s=new Set(); calculateAssignmentOverlaps(allAssignments).forEach(x=>{s.add(x.a.rowId);s.add(x.b.rowId);});return s; }

function matchesSearch(r,q){q=normalizeText(q).toLowerCase();if(!q)return true;return [r.employeeName,r.employeeId,r.role].some(v=>normalizeText(v).toLowerCase().includes(q));}
const originalDetailRows=detailRows;window.detailRows=function(filtered,overlapResults){const q=ui.ovSearch;const safeRows=(Array.isArray(filtered)?filtered:[]).filter(p=>{const r=assignmentForPlacement(p);return !r||matchesSearch(r,q);});if(!safeRows.length&&q)return '<tr><td colspan="8" class="empty">검색 조건과 일치하는 직원이 없습니다.<br>검색어 또는 필터를 변경해 주세요.</td></tr>';return originalDetailRows(safeRows,overlapResults);};

window.renderHistory=function(){

  (keys.length?'<div class="panel"><div class="panel-head"><h3>직원 선택</h3><div class="spacer"></div><select onchange="ui.histKey=this.value;renderHistory()">'+options+'</select></div><div class="panel-body"><b>'+esc(latest.employeeName||"[확인 필요]")+'</b> · 사번 '+esc(latest.employeeId||"[확인 필요]")+' · '+esc(latest.role||"[확인 필요]")+' · 전체 '+selected.length+'건 · 최근 '+esc(latest.siteName||"[확인 필요]")+' ('+esc(latest.startDate||"")+' ~ '+esc(latest.endDate||"")+')</div><div class="panel-body tight" style="overflow-x:auto"><table><thead><tr><th>현장명</th><th>직무/직급</th><th>배치 구분</th><th>배치 시작일</th><th>배치 종료일</th><th>진행 상태</th><th>원본 파일</th><th>원본 시트</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>':'<div class="panel"><div class="empty">표시할 직원 배치 이력이 없습니다.<br>엑셀 파일을 불러온 뒤 다시 확인해 주세요.</div></div>');

function exportColumns(rows){const originals=[];rows.forEach(r=>Object.keys(r.originalData||{}).forEach(k=>{if(!originals.includes(k)&&!REQUIRED_EXPORT_COLUMNS.includes(k)&&!SOURCE_COLUMNS.includes(k))originals.push(k);}));return REQUIRED_EXPORT_COLUMNS.concat(originals,SOURCE_COLUMNS);}
function isOriginalDateColumn(name){const n=normalizeHeader(name);return !n.includes("일수")&&/(투입|철수|시작일|종료일|착수일|완료일)/.test(n);}
function exportOriginalValue(name,value){if(value===undefined||value===null)return "";if(!isOriginalDateColumn(name))return value;return parseDateValue(value,false)||normalizeText(value);}
function exportObject(r,overlaps){const o={"직원번호":r.employeeId,"직원명":r.employeeName,"현장명":r.siteName,"직무/직급":r.role,"배치 시작일":r.startDate,"배치 종료일":r.endDate,"배치 구분":r.assignmentType,"진행 상태":statusLabel(r),"중복 배치 여부":overlaps.has(r.rowId)?"예":"아니오","날짜 오류 여부":r.dateError?"예":"아니오"};Object.entries(r.originalData||{}).forEach(([k,v])=>{if(!(k in o))o[k]=exportOriginalValue(k,v);});o["원본 파일명"]=r.sourceFile;o["원본 시트명"]=r.sourceSheet;o["원본 행 번호"]=r.sourceRow;return o;}
async function exportRows(rows,name){
  rows=Array.isArray(rows)?rows:[];const cols=exportColumns(rows);const missing=REQUIRED_EXPORT_COLUMNS.filter(x=>!cols.includes(x));const ovs=overlapSet();const objects=rows.map(r=>exportObject(r,ovs));
  if(objects.length!==rows.length||missing.length){toast("엑셀 생성 중 일부 행 또는 항목이 누락되었습니다. 내려받기를 중단하고 데이터를 다시 확인합니다.","err");throw new Error("export validation failed");}
  const matrix=[cols].concat(objects.map(o=>cols.map(c=>{const v=o[c];return v===undefined||v===null?"":v;})));if(matrix.length-1!==rows.length)throw new Error("row count mismatch");
  const widths=cols.map(c=>/날짜|시작일|종료일/.test(c)?14:Math.min(40,Math.max(12,c.length+4)));const bytes=await buildXlsx([{name:"전체 배치 이력",widths,rows:matrix}]);downloadBytes(name+"_"+ymd()+".xlsx",bytes);toast(rows.length+"개 원본 행 · "+cols.length+"개 열을 내려받았습니다.","ok");return {rows:rows.length,columns:cols.length,bytes};
}
window.exportStaff=function(){const ids=[...document.querySelectorAll('.exp-staff:checked')].map(x=>x.value);const keys=new Set(ids.map(id=>{const s=staffById(id);return s.employeeId?"id:"+normalizeText(s.employeeId).toLowerCase():"name:"+normalizeText(s.name).toLowerCase();}));const rows=allAssignments.filter(r=>!r.excludedReason&&keys.has(employeeKey(r)));if(!rows.length){toast("선택한 직원의 원본 배치 행이 없습니다.","err");return;}return exportRows(rows,"직원별_전체원본_배치");};
window.exportSites=function(){const ids=[...document.querySelectorAll('.exp-site:checked')].map(x=>x.value);const names=new Set(ids.map(id=>siteKey(siteById(id).name)));const rows=allAssignments.filter(r=>!r.excludedReason&&names.has(siteKey(r.siteName)));if(!rows.length){toast("선택한 현장의 원본 배치 행이 없습니다.","err");return;}return exportRows(rows,"현장별_전체원본_배치");};

const selfRows=Array.from({length:148},(_,i)=>({rowId:"self"+i,employeeId:"E"+(i%59),employeeName:"직원"+(i%59),siteName:"현장"+(i%59),role:"직무",startDate:"2025-01-01",endDate:"2025-01-01",assignmentType:"계약배치",originalData:i%2?{연락처:"",비고:false}:{소속:"A",점수:0},sourceFile:"test.xlsx",sourceSheet:"Sheet1",sourceRow:i+2,dateError:false,excludedReason:""}));
